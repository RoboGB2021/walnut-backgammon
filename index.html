<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walnut Backgammon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Marcellus+SC&display=swap">
<style>
/* Layout: full-bleed 3D table under lamplight; HUD floats in the corners like brass plaques on the frame. */
:root {
  color-scheme: dark;
  --bg: #120e0b;
  --panel: rgba(22, 16, 12, 0.8);
  --panel-edge: rgba(201, 163, 92, 0.22);
  --ink: #f0e6d2;
  --ink-dim: #b5a68c;
  --brass: #c9a35c;
  --brass-ink: #1b140c;
  --oxblood: #8c2f2b;
  --line: rgba(240, 230, 210, 0.14);
  --font-display: "Marcellus SC", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --gutter: 16px;
}
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; }
body { font: 14px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#scene.can-pick { cursor: pointer; }

.bar { position: fixed; left: var(--gutter); right: var(--gutter); display: flex; gap: 12px; pointer-events: none; }
.bar > * { pointer-events: auto; }
.top { top: calc(env(safe-area-inset-top, 0px) + var(--gutter)); justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
.bottom { bottom: calc(env(safe-area-inset-bottom, 0px) + var(--gutter)); justify-content: center; align-items: center; flex-wrap: wrap; }

.panel { background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); min-width: 0; }
.status-panel { max-width: 26rem; display: grid; gap: 4px; }
.eyebrow { margin: 0; font: 15px/1 var(--font-display); letter-spacing: 0.14em; color: var(--brass); }
.status { margin: 0; font-size: 17px; font-weight: 600; text-wrap: balance; }
.sub { margin: 0; color: var(--ink-dim); font-size: 12.5px; }

.table-panel { display: grid; gap: 10px; }
.scores { border-collapse: collapse; font-variant-numeric: tabular-nums; }
.scores th, .scores td { padding: 3px 8px; text-align: right; font-weight: 500; }
.scores thead th { font: 10.5px/1.2 var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-dim); }
.scores tbody th { text-align: left; font-weight: 600; white-space: nowrap; }
.scores td { font-family: var(--font-mono); font-size: 13px; }
.scores tr.turn th { color: var(--brass); }
.scores tr.turn th::after { content: " \25C2"; color: var(--brass); }
.swatch { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 7px; vertical-align: -1px; border: 1px solid var(--line); }
.swatch.w { background: #ece2cc; }
.swatch.b { background: #221d1a; border-color: rgba(240, 230, 210, 0.35); }

.settings { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { font: 500 12.5px var(--font-body); color: var(--ink-dim); background: transparent; border: 0; padding: 7px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: rgba(201, 163, 92, 0.18); color: var(--ink); }

.btn { font: 600 14px var(--font-body); color: var(--ink); background: rgba(240, 230, 210, 0.06); border: 1px solid var(--line); border-radius: 7px; padding: 11px 18px; cursor: pointer; transition: background 0.15s, opacity 0.15s, transform 0.08s; }
.btn:hover:not(:disabled) { background: rgba(240, 230, 210, 0.12); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.38; cursor: default; }
.btn.small { font-size: 12.5px; padding: 7px 10px; }
.btn.primary { background: var(--brass); color: var(--brass-ink); border-color: transparent; min-width: 9.5rem; }
.btn.primary:hover:not(:disabled) { background: #d6b26b; }
.bottom .btn { background-color: var(--panel); }
.bottom .btn.primary { background: var(--brass); }
button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.chips { display: flex; gap: 6px; padding: 7px 10px; background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 9px; min-height: 34px; align-items: center; }
.chips:empty { display: none; }
.chip { width: 30px; height: 30px; display: block; transition: opacity 0.2s; }
.chip.used { opacity: 0.25; }

.toast { position: fixed; left: 50%; top: 34%; transform: translate(-50%, -6px); background: var(--panel); border: 1px solid var(--panel-edge); color: var(--ink); padding: 10px 16px; border-radius: 9px; font-weight: 600; opacity: 0; transition: opacity 0.25s, transform 0.25s; pointer-events: none; max-width: calc(100% - 2 * var(--gutter)); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.fatal { position: fixed; inset: 0; display: grid; place-items: center; padding: var(--gutter); text-align: center; color: var(--ink-dim); }

@media (max-width: 640px), (max-height: 560px) {
  .top { gap: 8px; }
  .panel { padding: 8px 10px; }
  .status-panel { max-width: none; flex: 1 1 100%; gap: 2px; }
  .status { font-size: 14.5px; }
  .eyebrow, .sub, .scores thead { display: none; }
  .table-panel { flex: 1 1 100%; grid-template-columns: auto 1fr; align-items: center; gap: 8px; }
  .scores th, .scores td { padding: 1px 6px; }
  .settings { justify-content: flex-end; }
  .btn { padding: 9px 13px; }
  .btn.primary { min-width: 0; }
  .chips { padding: 5px 8px; min-height: 28px; }
  .chip { width: 24px; height: 24px; }
}
@media (min-width: 700px) and (max-height: 560px) {
  .top { flex-wrap: nowrap; }
  .status-panel { flex: 1 1 180px; }
  .table-panel { flex: 0 0 auto; }
}
@media (prefers-reduced-motion: reduce) {
  .toast, .btn, .chip { transition: none; }
}
</style>

<body>
<canvas id="scene" aria-label="Backgammon board"></canvas>

<header class="bar top">
  <section class="panel status-panel">
    <p class="eyebrow">Backgammon</p>
    <p id="status" class="status" aria-live="polite">Throw one die each to decide who moves first.</p>
    <p id="sub" class="sub">Click a glowing checker, then a lit point. Space rolls, U undoes. Drag to orbit.</p>
  </section>
  <section class="panel table-panel">
    <table class="scores">
      <thead><tr><th scope="col"><span class="sr">Player</span></th><th scope="col">Pips</th><th scope="col">Off</th><th scope="col">Score</th></tr></thead>
      <tbody>
        <tr id="rowW"><th scope="row"><span class="swatch w"></span><span id="nameW">You</span></th><td id="pipW">167</td><td id="offW">0</td><td id="scoreW">0</td></tr>
        <tr id="rowB"><th scope="row"><span class="swatch b"></span><span id="nameB">Computer</span></th><td id="pipB">167</td><td id="offB">0</td><td id="scoreB">0</td></tr>
      </tbody>
    </table>
    <div class="settings">
      <div class="seg" role="group" aria-label="Opponent">
        <button id="modeAi" type="button" aria-pressed="true">vs Computer</button>
        <button id="modePvp" type="button" aria-pressed="false">Two players</button>
      </div>
      <button id="soundBtn" type="button" class="btn small" aria-pressed="true">Sound on</button>
      <button id="newBtn" type="button" class="btn small">New game</button>
    </div>
  </section>
</header>

<footer class="bar bottom">
  <div id="chips" class="chips" aria-label="Dice to play"></div>
  <button id="undoBtn" type="button" class="btn" disabled>Undo</button>
  <button id="primaryBtn" type="button" class="btn primary">Throw for first move</button>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as CANNON from 'cannon-es';

/* ------------------------------------------------------------------ *
 *  Dimensions (1 unit ≈ 4 cm). White moves 24 → 1, home board 1–6.   *
 * ------------------------------------------------------------------ */
const W = 1, B = -1;
const R = 0.45, H = 0.2, S = 0.92;            // checker radius, thickness, stack spacing
const HX = 6.5, HZ = 5.5;                      // half extents of the playing field
const FH = 0.5, FT = 0.6;                      // frame height and thickness
const TRAY_X0 = HX + FT, TRAY_X1 = TRAY_X0 + 1.2, OUTER_X = TRAY_X1 + FT, LEFT_X = -HX - FT;
const TRAY_X = (TRAY_X0 + TRAY_X1) / 2;
const D = 0.42;                                // die edge
const GRAV = 38;                               // scaled gravity for the 4 cm unit

const $ = (id) => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
let seed = 11;
const srand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;

/* ------------------------------------------------------------------ *
 *  Sound: everything is synthesised with Web Audio — filtered noise   *
 *  transients plus inharmonic modal partials, through a small room.   *
 * ------------------------------------------------------------------ */
const Snd = {
  ctx: null, on: true, voices: [],
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = (this.ctx = new AC());
    this.master = ctx.createGain();
    this.master.gain.value = this.on ? 0.9 : 0;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = 0.002; comp.release.value = 0.15;
    this.master.connect(comp).connect(ctx.destination);
    this.bus = ctx.createGain();
    this.bus.connect(this.master);
    const verb = ctx.createConvolver();
    verb.buffer = this.impulse(1.3);
    const wet = ctx.createGain(); wet.gain.value = 0.2;
    this.bus.connect(wet).connect(verb).connect(this.master);
    const len = ctx.sampleRate * 2;
    this.noise = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = this.noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  },
  impulse(sec) {
    const ctx = this.ctx, rate = ctx.sampleRate, len = Math.floor(rate * sec);
    const buf = ctx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.4) * 0.6;
      for (let k = 0; k < 9; k++) {
        const idx = Math.floor(rate * (0.006 + k * 0.0067 + Math.random() * 0.003));
        if (idx < len) d[idx] += (Math.random() < 0.5 ? -1 : 1) * 0.7 * Math.pow(0.78, k);
      }
    }
    return buf;
  },
  setOn(v) {
    this.on = v;
    if (this.master) this.master.gain.setTargetAtTime(v ? 0.9 : 0, this.ctx.currentTime, 0.02);
  },
  ready() { return this.ctx && this.on && this.ctx.state === 'running'; },
  out(pan) {
    const p = this.ctx.createStereoPanner();
    p.pan.value = clamp(pan, -1, 1);
    p.connect(this.bus);
    return p;
  },
  burst(t, { type = 'bandpass', freq = 1000, q = 1, dur = 0.05, gain = 0.5, attack = 0.0015, pan = 0 }) {
    const ctx = this.ctx, s = ctx.createBufferSource();
    s.buffer = this.noise;
    s.playbackRate.value = rand(0.85, 1.15);
    const f = ctx.createBiquadFilter();
    f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + dur);
    s.connect(f).connect(g).connect(this.out(pan));
    s.start(t, Math.random() * 1.5);
    s.stop(t + attack + dur + 0.05);
  },
  modes(t, freqs, { gain = 0.2, decay = 0.08, pan = 0 }) {
    const ctx = this.ctx, o = this.out(pan);
    freqs.forEach((fr, i) => {
      const osc = ctx.createOscillator();
      osc.frequency.value = fr * rand(0.96, 1.04);
      const g = ctx.createGain();
      const a = gain / (1 + i * 0.55), dc = decay / (1 + i * 0.3);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(a, t + 0.001);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dc);
      osc.connect(g).connect(o);
      osc.start(t);
      osc.stop(t + dc + 0.02);
    });
  },
  // The hollow walnut case answers every hit with a short low resonance.
  body(t, g, pan) { this.modes(t, [118 + rand(-8, 8), 196, 287], { gain: g * 0.22, decay: 0.16, pan }); },

  dice(v, surface, x) {
    if (!this.ready()) return;
    const g = Math.pow(clamp((v - 0.35) / 10, 0, 1), 1.2);
    if (g < 0.01) return;
    const t = this.ctx.currentTime, pan = x / 9;
    if (surface === 'felt') {
      this.burst(t, { type: 'lowpass', freq: 700 + 900 * g, q: 0.7, dur: 0.045, gain: g * 0.75, pan });
      this.burst(t, { type: 'bandpass', freq: 2400, q: 2, dur: 0.01, gain: g * 0.18, pan });
      this.body(t, g * 0.7, pan);
    } else if (surface === 'wood') {
      this.burst(t, { type: 'bandpass', freq: rand(2400, 3200), q: 1.6, dur: 0.028, gain: g * 0.8, pan });
      this.modes(t, [1850, 3040, 4420], { gain: g * 0.22, decay: 0.07, pan });
      this.body(t, g * 1.2, pan);
    } else if (surface === 'die') {
      this.burst(t, { type: 'highpass', freq: 3200, q: 0.8, dur: 0.014, gain: g * 0.6, pan });
      this.modes(t, [3900, 5650, 7300], { gain: g * 0.16, decay: 0.035, pan });
    } else {
      this.burst(t, { type: 'bandpass', freq: 2100, q: 1.4, dur: 0.02, gain: g * 0.6, pan });
      this.modes(t, [1500, 2580, 3700], { gain: g * 0.18, decay: 0.05, pan });

  },
  checker(v, surface, x) {
    if (!this.ready()) return;
    const g = Math.pow(clamp(v / 5.5, 0, 1), 1.1);
    if (g < 0.02) return;
    const t = this.ctx.currentTime, pan = x / 9;
    if (surface === 'checker') {
      this.burst(t, { type: 'bandpass', freq: rand(1600, 2000), q: 1.3, dur: 0.024, gain: g * 0.85, pan });
      this.modes(t, [1180, 1960, 2980, 4150], { gain: g * 0.26, decay: 0.075, pan });
      this.modes(t, [310], { gain: g * 0.12, decay: 0.05, pan });
    } else if (surface === 'wood') {
      this.burst(t, { type: 'bandpass', freq: 1400, q: 1.2, dur: 0.03, gain: g * 0.75, pan });
      this.modes(t, [620, 1130, 1720], { gain: g * 0.25, decay: 0.09, pan });
      this.body(t, g, pan);
    } else {
      this.burst(t, { type: 'lowpass', freq: 650, q: 0.8, dur: 0.06, gain: g * 0.9, pan });
      this.modes(t, [430, 780], { gain: g * 0.2, decay: 0.05, pan });
      this.body(t, g * 1.1, pan);
    }
  },
  pickup(x) {
    if (!this.ready()) return;
    const t = this.ctx.currentTime, pan = x / 9;
    this.burst(t, { type: 'bandpass', freq: 1500, q: 0.9, dur: 0.05, gain: 0.08, attack: 0.008, pan });
    this.modes(t, [1600, 2550], { gain: 0.035, decay: 0.05, pan });
  },
  // Two dice rattling inside a leather cup, then the release.
  shake(dur) {
    if (!this.ready()) return;
    const t0 = this.ctx.currentTime;
    for (let k = 0; k < dur * 7.5; k++) {
      this.burst(t0 + k / 7.5, { type: 'lowpass', freq: 600, q: 0.6, dur: 0.08, gain: 0.07, attack: 0.02 });
    }
    for (let i = 0; i < dur * 46; i++) {
      const t = t0 + Math.random() * dur;
      this.burst(t, { type: 'highpass', freq: rand(2400, 4000), q: 0.7, dur: 0.012, gain: rand(0.04, 0.13) });
      if (Math.random() < 0.5) this.modes(t, [3700, 5300, 7000], { gain: rand(0.02, 0.05), decay: 0.025 });
      if (Math.random() < 0.3) this.burst(t, { type: 'lowpass', freq: 380, q: 0.8, dur: 0.05, gain: 0.16 });
    }
  },
  toss() {
    if (!this.ready()) return;
    const ctx = this.ctx, t = ctx.currentTime, s = ctx.createBufferSource();
    s.buffer = this.noise;
    const f = ctx.createBiquadFilter();
    f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(500, t);
    f.frequency.exponentialRampToValueAtTime(1800, t + 0.16);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.07, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    s.connect(f).connect(g).connect(this.bus);
    s.start(t);
    s.stop(t + 0.25);
  },
  // Continuous rolling noise for a die tumbling across the felt.
  roll(i, speed, contact, x) {
    if (!this.ctx || this.ctx.state !== 'running') return;
    let v = this.voices[i];
    if (!v) {
      const ctx = this.ctx, s = ctx.createBufferSource();
      s.buffer = this.noise; s.loop = true;
      const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 0.9;
      const g = ctx.createGain(); g.gain.value = 0;
      const p = ctx.createStereoPanner();
      s.connect(f).connect(g).connect(p).connect(this.bus);
      s.start();
      v = this.voices[i] = { f, g, p };
    }
    const t = this.ctx.currentTime;
    const target = contact ? Math.pow(clamp(speed / 10, 0, 1), 1.6) * 0.22 : 0;
    v.g.gain.setTargetAtTime(target, t, 0.025);
    v.f.frequency.setTargetAtTime(380 + speed * 70, t, 0.05);
    v.p.pan.setTargetAtTime(clamp(x / 9, -1, 1), t, 0.05);
  },
};

/* ------------------------------------------------------------------ *
 *  Rules engine. pts[1..24]: +n white checkers, −n black checkers.    *
 * ------------------------------------------------------------------ */
const sideKey = (pl) => (pl === W ? 'w' : 'b');
const toAbs = (pl, q) => (pl === W ? q : 25 - q);
const cloneState = (s) => ({ pts: s.pts.slice(), bar: { ...s.bar }, off: { ...s.off } });
const keyOf = (s) => s.pts.join(',') + '|' + s.bar.w + s.bar.b + '|' + s.off.w + ',' + s.off.b;

function initialState() {
  const pts = new Array(25).fill(0);
  pts[24] = 2; pts[13] = 5; pts[8] = 3; pts[6] = 5;
  pts[1] = -2; pts[12] = -5; pts[17] = -3; pts[19] = -5;
  return { pts, bar: { w: 0, b: 0 }, off: { w: 0, b: 0 } };
}
function allHome(s, pl) {
  if (s.bar[sideKey(pl)]) return false;
  for (let q = 7; q <= 24; q++) if (s.pts[toAbs(pl, q)] * pl > 0) return false;
  return true;
}
function singleMoves(s, pl, d) {
  const res = [];
  const target = (q) => {
    const a = toAbs(pl, q), c = s.pts[a] * pl;
    return c <= -2 ? null : { to: a, hit: c === -1 };
  };
  if (s.bar[sideKey(pl)] > 0) {
    const t = target(25 - d);
    if (t) res.push({ from: 'bar', to: t.to, die: d, hit: t.hit });
    return res;
  }
  const home = allHome(s, pl);
  for (let q = 24; q >= 1; q--) {
    const a = toAbs(pl, q);
    if (s.pts[a] * pl <= 0) continue;
    const nq = q - d;
    if (nq >= 1) {
      const t = target(nq);
      if (t) res.push({ from: a, to: t.to, die: d, hit: t.hit });
    } else if (home) {
      let higher = false;
      if (nq < 0) for (let q2 = q + 1; q2 <= 6; q2++) if (s.pts[toAbs(pl, q2)] * pl > 0) { higher = true; break; }
      if (!higher) res.push({ from: a, to: 'off', die: d, hit: false });
    }
  }
  return res;
}
function applyMove(s, pl, m) {
  const n = cloneState(s), k = sideKey(pl), ok = sideKey(-pl);
  if (m.from === 'bar') n.bar[k]--; else n.pts[m.from] -= pl;
  if (m.to === 'off') n.off[k]++;
  else {
    if (m.hit) { n.pts[m.to] = 0; n.bar[ok]++; }
    n.pts[m.to] += pl;
  }
  return n;
}
const remKey = (r) => r.slice().sort().join('');
function maxLen(s, pl, rem, memo) {
  if (!rem.length) return 0;
  const k = keyOf(s) + '#' + remKey(rem);
  if (memo.has(k)) return memo.get(k);
  let best = 0;
  const tried = new Set();
  outer: for (let i = 0; i < rem.length; i++) {
    const d = rem[i];

  for (const ov of Object.values(overlays)) ov.visible = false;
  rings.forEach((r) => { r.visible = false; });
  let ri = 0;
  for (const [to, path] of dests) {
    const key = locKey(turn, to), last = path[path.length - 1];
    overlays[to === 'off' ? 'off' + turn : to].visible = true;
    if (ri < rings.length) {
      const p = slotPos(key, last.hit ? 0 : stacks[key].length);
      rings[ri].position.set(p.x, p.y - H / 2 + 0.012, p.z);
      rings[ri].visible = true; ri++;
    }
  }
  refreshHud();
}

function primaryAction() {
  Snd.init();
  if (phase === 'opening') openingRoll();
  else if (phase === 'await' && isHuman(turn)) rollFor(turn);
  else if (phase === 'done') endTurn();
  else if (phase === 'over') newGame(false);
}
$('primaryBtn').addEventListener('click', primaryAction);
$('undoBtn').addEventListener('click', () => { Snd.init(); undo(); });
$('newBtn').addEventListener('click', () => { Snd.init(); score.w = score.b = 0; newGame(false); });
$('soundBtn').addEventListener('click', (e) => {
  Snd.init();
  Snd.setOn(!Snd.on);
  e.currentTarget.textContent = Snd.on ? 'Sound on' : 'Sound off';
  e.currentTarget.setAttribute('aria-pressed', String(Snd.on));
});
function setMode(m) {
  if (mode === m) return;
  mode = m;
  refresh();
  if (phase === 'await') endTurnStatusRefresh();
}
function endTurnStatusRefresh() {
  if (isHuman(turn)) setStatus(mode === 'ai' ? 'Your turn. Roll the dice.' : `${who(turn)} to roll.`);
  else { setStatus(`${who(turn)} is rolling.`); const myGen = gen; setTimeout(() => { if (myGen === gen && phase === 'await' && !isHuman(turn)) rollFor(turn); }, 500); }
}
// After a mouse or touch press, hand focus back to the table so Space still rolls.
document.querySelectorAll('button').forEach((b) => b.addEventListener('pointerup', () => setTimeout(() => b.blur(), 0)));
$('modeAi').addEventListener('click', () => setMode('ai'));
$('modePvp').addEventListener('click', () => setMode('pvp'));
window.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('button, input, select, textarea')) return;
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); primaryAction(); }
  else if (e.key === 'u' || e.key === 'U' || ((e.ctrlKey || e.metaKey) && e.key === 'z')) { e.preventDefault(); undo(); }
  else if (e.key === 'Escape') { selected = null; dests = new Map(); refresh(); }
});

/* ------------------------------------------------------------------ *
 *  Picking                                                            *
 * ------------------------------------------------------------------ */
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pickLoc(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(pickables, false)[0];
  return hit ? hit.object.userData.loc : null;
}
let down = null;
canvas.addEventListener('pointerdown', (e) => { Snd.init(); down = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', (e) => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down[0], e.clientY - down[1]);
  down = null;
  if (moved < 7) handleClick(pickLoc(e));
});
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse' || down) return;
  const loc = phase === 'move' && isHuman(turn) ? pickLoc(e) : null;
  canvas.classList.toggle('can-pick', loc !== null && (sources.has(loc) || dests.has(loc)));
});
function handleClick(loc) {
  if (phase !== 'move' || !isHuman(turn)) return;
  if (selected !== null && loc !== null && dests.has(loc)) { playPath(dests.get(loc)); return; }
  if (loc !== null && sources.has(loc) && selected !== loc) {
    selected = loc;
    dests = reachFrom(state, turn, rem, loc);
    const st = stacks[locKey(turn, loc)];
    Snd.pickup(checkers[st[st.length - 1]].body.position.x);
  } else { selected = null; dests = new Map(); }
  refresh();
}

/* ------------------------------------------------------------------ *
 *  Main loop                                                          *
 * ------------------------------------------------------------------ */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  updateCheckers(dt);
  world.step(1 / 120, dt, 8);
  updateDice(dt);
  const pulse = 0.5 + 0.5 * Math.sin(now * 0.006);
  for (const c of checkers) {
    const sel = c.id === selectedTop;
    c.lift += ((sel ? 0.16 : 0) - c.lift) * Math.min(1, dt * 14);
    c.mesh.material.emissiveIntensity = sel ? 0.4 : movableTops.has(c.id) ? 0.08 + 0.14 * pulse : 0;
    c.mesh.position.set(c.body.position.x, c.body.position.y + c.lift, c.body.position.z);
    c.mesh.quaternion.set(c.body.quaternion.x, c.body.quaternion.y, c.body.quaternion.z, c.body.quaternion.w);
  }
  for (const ov of Object.values(overlays)) if (ov.visible) ov.material.opacity = 0.16 + 0.2 * pulse;
  for (const r of rings) if (r.visible) r.material.opacity = 0.45 + 0.4 * pulse;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------------ *
 *  Boot (keeps the position across live page updates when possible)  *
 * ------------------------------------------------------------------ */
let turnStart = null;
function start(data) {
  fitView();
  newGame(true);
  if (data && data.state && data.stacks) {
    state = data.state; stacks = data.stacks; turn = data.turn === B ? B : W; mode = data.mode === 'pvp' ? 'pvp' : 'ai';
    Object.assign(score, data.score || {});
    phase = data.phase === 'opening' ? 'opening' : 'await';
    syncPositions(true);
    if (phase === 'await') endTurnStatusRefresh();
    refresh();
  }
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => {
  const opening = phase === 'opening' || (phase === 'rolling' && !turnDice.length && !turnStart && state.off.w + state.off.b === 0 && pipCount(state, W) === 167 && pipCount(state, B) === 167);
  const snap = turnStart && phase !== 'await' && phase !== 'rolling' && phase !== 'over' ? turnStart : { state, stacks };
  return { state: snap.state, stacks: snap.stacks, turn, mode, score: { ...score }, phase: opening ? 'opening' : 'await' };
});
if (window.claude?.hot?.ready) window.claude.hot.ready(start);
else start(window.claude?.hot?.data ?? {});
</script>
